<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="水墨山水：远峰、雾带、坡岸上一株松，一条小径通到亭子">
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f6f2e8" stop-opacity="0" />
      <stop offset="0.6" stop-color="#a5875a" stop-opacity="0.06" />
      <stop offset="1" stop-color="#f6f2e8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="farInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b453b" stop-opacity="0.2" />
      <stop offset="0.5" stop-color="#4b453b" stop-opacity="0.12" />
      <stop offset="1" stop-color="#f6f2e8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="midInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b453b" stop-opacity="0.34" />
      <stop offset="0.45" stop-color="#4b453b" stop-opacity="0.18" />
      <stop offset="1" stop-color="#f6f2e8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="nearInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24211c" stop-opacity="0.46" />
      <stop offset="0.4" stop-color="#24211c" stop-opacity="0.28" />
      <stop offset="1" stop-color="#24211c" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="foreInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24211c" stop-opacity="0.56" />
      <stop offset="1" stop-color="#24211c" stop-opacity="0.26" />
    </linearGradient>

    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f2e8" stop-opacity="0.1" />
      <stop offset="0.3" stop-color="#f6f2e8" stop-opacity="0.8" />
      <stop offset="0.7" stop-color="#f6f2e8" stop-opacity="0.9" />
      <stop offset="1" stop-color="#f6f2e8" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6f2e8" stop-opacity="0.9" />
      <stop offset="1" stop-color="#f6f2e8" stop-opacity="0" />
    </radialGradient>

    <filter id="grove" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f6f2e8" />
  <rect width="1200" height="675" fill="url(#paperWash)" />
  <ellipse cx="900" cy="240" rx="360" ry="210" fill="url(#glow)" />

  <!-- 远峰：三处尖顶，墨最淡 -->
  <path
    d="M-20 356 C50 336 118 308 158 292 C182 254 196 208 206 178 C212 162 222 162 228 178
       C246 216 282 272 316 300 C338 318 356 326 376 330
       C420 296 470 214 500 178 C508 166 518 168 524 182
       C556 236 596 292 632 316 C652 330 672 336 694 340
       C742 306 800 232 838 206 C848 198 858 202 862 214
       C884 258 924 296 972 318 C1048 346 1140 356 1220 362
       L1220 470 L-20 470 Z"
    fill="url(#farInk)" />
  <!-- 峰脊：只画一边，笔断意连 -->
  <g stroke="#4b453b" stroke-opacity="0.13" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M212 186 C218 224 230 264 246 294" />
    <path d="M506 186 C514 226 528 266 546 298" />
    <path d="M844 214 C854 250 868 282 886 308" />
    <path d="M132 300 C162 330 196 350 232 360" />
  </g>

  <!-- 雾带 -->
  <rect x="0" y="330" width="1200" height="62" fill="url(#mist)" opacity="0.85" />

  <!-- 中景：两座较实的小峰 -->
  <path
    d="M-20 452 C50 430 110 404 150 384 C176 348 196 322 210 306 C218 296 226 298 232 310
       C252 344 286 384 322 406 C348 422 372 430 400 436
       C452 400 512 340 556 322 C566 318 576 322 582 334
       C612 372 654 402 700 420 C742 436 800 442 860 446
       C900 420 960 380 1010 366 C1022 362 1032 366 1038 378
       C1064 410 1112 434 1170 444 C1190 448 1206 452 1220 454
       L1220 560 L-20 560 Z"
    fill="url(#midInk)" />

  <!-- 中景的侧笔 -->
  <g stroke="#4b453b" stroke-opacity="0.2" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M210 306 C206 336 198 364 186 388" />
    <path d="M232 310 C238 344 248 378 262 402" />
    <path d="M556 322 C552 354 544 382 532 404" />
    <path d="M582 334 C590 366 602 396 618 414" />
    <path d="M1010 366 C1006 394 998 418 986 436" />
    <path d="M1038 378 C1046 404 1058 428 1074 444" />
  </g>

  <!-- 近坡 -->
  <path
    d="M-20 545 C60 528 120 512 170 504 C220 496 262 512 302 528
       C340 542 380 540 420 532 C470 522 520 530 570 538
       C630 548 690 542 750 534 C810 526 870 534 930 542
       C990 550 1050 546 1110 538 C1150 533 1190 538 1220 542
       L1220 675 L-20 675 Z"
    fill="url(#nearInk)" />

  <!-- 前景坡脚，墨最重 -->
  <path
    d="M-20 612 C60 598 130 590 200 594 C260 598 320 608 380 612
       C440 616 500 610 560 606 C620 602 680 610 740 614
       C800 618 860 612 920 606 C980 600 1040 608 1100 612
       C1140 615 1180 614 1220 618 L1220 675 L-20 675 Z"
    fill="url(#foreInk)" />

  <!-- 皴：成组的短斜笔，顺着坡面走 -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#24211c" stroke-opacity="0.13" stroke-width="1.5">
      <path d="M126 540 L150 526" /><path d="M138 548 L164 532" /><path d="M150 556 L174 542" /><path d="M120 548 L140 540" />
      <path d="M258 542 L282 528" /><path d="M270 550 L296 534" /><path d="M282 558 L306 544" /><path d="M250 552 L272 544" />
      <path d="M404 542 L428 528" /><path d="M416 550 L442 534" /><path d="M428 558 L452 544" />
      <path d="M604 554 L628 540" /><path d="M616 562 L642 546" /><path d="M628 570 L652 556" />
      <path d="M812 546 L836 532" /><path d="M824 554 L850 538" /><path d="M836 562 L860 548" />
      <path d="M998 552 L1022 538" /><path d="M1010 560 L1036 544" /><path d="M1022 568 L1046 554" />
    </g>
    <g stroke="#24211c" stroke-opacity="0.1" stroke-width="1.2">
      <path d="M186 566 L210 552" /><path d="M198 574 L222 560" />
      <path d="M500 560 L524 546" /><path d="M512 568 L536 554" />
      <path d="M700 570 L724 556" /><path d="M712 578 L736 564" />
      <path d="M900 562 L924 548" /><path d="M912 570 L936 556" />
    </g>
  </g>

  <!-- 点苔：坡上几簇墨点 -->
  <g fill="#24211c">
    <g fill-opacity="0.3">
      <circle cx="168" cy="534" r="2.2" /><circle cx="176" cy="540" r="1.4" />
      <circle cx="316" cy="524" r="2" /><circle cx="470" cy="534" r="1.9" />
      <circle cx="742" cy="540" r="2.1" /><circle cx="1060" cy="534" r="1.8" />
      <circle cx="1120" cy="540" r="1.5" />
    </g>
    <g fill-opacity="0.18">
      <circle cx="228" cy="528" r="1.4" /><circle cx="380" cy="528" r="1.3" />
      <circle cx="560" cy="546" r="1.5" /><circle cx="884" cy="534" r="1.4" />
    </g>
  </g>

  <!-- 远树：几笔竖点，只留一个高度的意思 -->
  <g fill="none" stroke="#24211c" stroke-linecap="round">
    <path d="M262 528 C260 518 259 512 258 506" stroke-width="2.4" stroke-opacity="0.34" />
    <path d="M272 526 C270 514 270 508 271 502" stroke-width="2" stroke-opacity="0.28" />
    <path d="M282 530 C280 520 281 514 282 508" stroke-width="1.8" stroke-opacity="0.24" />
    <path d="M252 532 C250 524 250 518 251 512" stroke-width="1.6" stroke-opacity="0.2" />
    <path d="M292 534 C291 526 292 520 294 516" stroke-width="1.4" stroke-opacity="0.16" />
  </g>
  <g fill="#24211c" fill-opacity="0.2">
    <circle cx="258" cy="504" r="2.4" /><circle cx="271" cy="500" r="2" /><circle cx="282" cy="506" r="1.7" />
    <circle cx="251" cy="510" r="1.4" /><circle cx="294" cy="514" r="1.2" />
  </g>
  <!-- 小径：断笔，像干笔拖出来 -->
  <g fill="none" stroke="#24211c" stroke-linecap="round">
    <path d="M596 675 C588 642 618 620 640 600 C664 578 652 556 674 540 C694 526 686 512 706 498"
      stroke-width="2.1" stroke-opacity="0.36" stroke-dasharray="126 10 54 13 30 9" />
    <path d="M609 675 C601 644 630 622 653 601 C676 580 664 558 686 542 C706 528 698 514 718 500"
      stroke-width="1.4" stroke-dasharray="96 14 40 11" stroke-opacity="0.22" />
  </g>

  <!-- 亭：几笔撑起来的空架子 -->
  <g fill="none" stroke="#24211c" stroke-opacity="0.46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M842 470 C866 462 890 452 916 444 C940 436 966 442 988 452" stroke-width="2.2" />
    <path d="M852 480 C872 474 894 466 916 460 C940 454 962 458 978 466" stroke-width="1.6" stroke-opacity="0.3" />
    <path d="M868 470 L868 508" stroke-width="1.8" />
    <path d="M958 466 L958 508" stroke-width="1.8" />
    <path d="M858 508 L968 508" stroke-width="1.6" stroke-opacity="0.34" />
    <path d="M866 458 L866 448" stroke-width="1.2" stroke-opacity="0.3" />
  </g>

  <!-- 远处两三只鸟 -->
  <g fill="none" stroke="#24211c" stroke-opacity="0.24" stroke-width="1.3" stroke-linecap="round">
    <path d="M962 196 C968 190 974 190 980 195 C986 190 992 190 998 196" />
    <path d="M1006 214 C1011 209 1016 209 1021 213 C1026 209 1031 209 1036 214" />
    <path d="M930 226 C935 221 940 221 945 225 C950 221 955 221 960 226" />
  </g>

  <!-- 水痕：坡脚几道横擦 -->
  <g stroke="#4b453b" stroke-opacity="0.16" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M120 640 C170 636 216 638 268 634" />
    <path d="M186 656 C240 652 300 654 356 650" />
    <path d="M760 638 C812 634 862 636 916 632" />
    <path d="M824 656 C878 652 940 654 996 650" />
  </g>

  <!-- 印 -->
  <g transform="rotate(-3 1122 592)" opacity="0.88">
    <rect x="1096" y="566" width="52" height="52" rx="3" fill="#9c4033" fill-opacity="0.92" />
    <rect x="1102" y="572" width="40" height="40" rx="2" fill="none" stroke="#f6f2e8" stroke-opacity="0.55" stroke-width="1" />
    <text x="1122" y="600" text-anchor="middle" font-family="KaiTi, STKaiti, 'Songti SC', serif"
      font-size="25" fill="#f6f2e8" fill-opacity="0.95">記</text>
  </g>

  <rect width="1200" height="675" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply" />
</svg>
