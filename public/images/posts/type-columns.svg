<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="水墨小景：一张摊开的稿纸，纸上三组墨线代表段落，首行缩进两字，行尾的小方点表示标点占位">
  <defs>
    <linearGradient id="deskWash" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4b453b" stop-opacity="0.09" />
      <stop offset="0.55" stop-color="#4b453b" stop-opacity="0.03" />
      <stop offset="1" stop-color="#a5875a" stop-opacity="0.07" />
    </linearGradient>

    <linearGradient id="sheetTone" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f6f2e8" stop-opacity="1" />
      <stop offset="0.7" stop-color="#f8f4ea" stop-opacity="1" />
      <stop offset="1" stop-color="#f4efe2" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="strokeInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24211c" stop-opacity="0.62" />
      <stop offset="0.55" stop-color="#24211c" stop-opacity="0.5" />
      <stop offset="1" stop-color="#4b453b" stop-opacity="0.34" />
    </linearGradient>

    <linearGradient id="strokeInkSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b453b" stop-opacity="0.4" />
      <stop offset="1" stop-color="#4b453b" stop-opacity="0.2" />
    </linearGradient>

    <filter id="sheetShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="roughen" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.5" numOctaves="2" seed="13" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="29" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1000" height="620" fill="#f6f2e8" />
  <rect width="1000" height="620" fill="url(#deskWash)" />

  <!-- 一张微斜的稿纸：先影，后纸，最后一道淡边 -->
  <path d="M132 92 C300 88 620 86 878 92 C882 94 884 98 884 104
           C886 260 884 420 880 552 C878 560 874 564 868 564
           C640 570 360 568 140 562 C134 560 130 556 130 550
           C126 400 128 240 132 92 Z"
    fill="#24211c" fill-opacity="0.09" filter="url(#sheetShadow)" transform="translate(6 8)" />
  <path d="M132 92 C300 88 620 86 878 92 C882 94 884 98 884 104
           C886 260 884 420 880 552 C878 560 874 564 868 564
           C640 570 360 568 140 562 C134 560 130 556 130 550
           C126 400 128 240 132 92 Z"
    fill="url(#sheetTone)" />
  <path d="M132 92 C300 88 620 86 878 92 C882 94 884 98 884 104
           C886 260 884 420 880 552 C878 560 874 564 868 564
           C640 570 360 568 140 562 C134 560 130 556 130 550
           C126 400 128 240 132 92 Z"
    fill="none" stroke="#4b453b" stroke-opacity="0.16" stroke-width="1.4" />

  <!-- 第一组：首行缩进两字，行距比笔画宽得多 -->
  <g filter="url(#roughen)">
    <path d="M196 150 C270 148 340 149 412 147.6 L412 154.4 C340 156 270 157 196 158 Z" fill="url(#strokeInk)" />
    <path d="M162 194 C240 192.4 316 193.4 392 192 L392 198.6 C316 200 240 201 162 202 Z" fill="url(#strokeInk)" />
    <path d="M162 238 C238 236.6 312 237.6 386 236.4 L386 242.6 C312 244 238 245 162 246 Z" fill="url(#strokeInk)" />
    <path d="M162 282 C240 280.4 316 281.4 392 280 L392 286.2 C316 287.6 240 288.6 162 290 Z" fill="url(#strokeInk)" />
    <path d="M162 326 C226 324.6 288 325.6 350 324.4 L350 330.4 C288 332 226 333 162 334 Z" fill="url(#strokeInkSoft)" />

    <!-- 第二组：行尾不齐，中间一行把字距拉开 -->
    <path d="M536 150 C602 148.6 668 149.6 734 148.4 L734 155 C668 156.4 602 157.4 536 158 Z" fill="url(#strokeInk)" />
    <path d="M536 194 C600 192.8 662 193.8 726 192.6 L726 198.8 C662 200 600 201 536 202 Z" fill="url(#strokeInk)" />
    <path d="M536 238 C594 236.6 650 237.6 706 236.4 L706 242.4 C650 244 594 245 536 246 Z" fill="url(#strokeInkSoft)" />
    <path d="M536 282 C588 280.6 638 281.6 690 280.4 L690 286.2 C638 287.8 588 288.8 536 290 Z" fill="url(#strokeInk)" />

  </g>

  <!-- 字距打开的那一行：断续的短笔，一格一格 -->
  <g filter="url(#roughen)" fill="url(#strokeInkSoft)">
    <path d="M538 326 L554 325.6 L554 329.8 L538 330.2 Z" />
    <path d="M566 325.6 L582 325.2 L582 329.4 L566 329.8 Z" />
    <path d="M594 325.2 L610 324.8 L610 329 L594 329.4 Z" />
    <path d="M622 324.8 L638 324.4 L638 328.6 L622 329 Z" />
    <path d="M650 324.4 L666 324 L666 328.2 L650 328.6 Z" />
    <path d="M678 324 L694 323.6 L694 327.8 L678 328.2 Z" />
  </g>

  <!-- 行尾的标点：一个小方点，占一格 -->
  <g fill="#24211c" fill-opacity="0.5">
    <rect x="420" y="146" width="9" height="9" rx="1" />
    <rect x="400" y="234" width="9" height="9" rx="1" />
    <rect x="742" y="146" width="9" height="9" rx="1" />
    <rect x="714" y="234" width="9" height="9" rx="1" />
    <rect x="358" y="320" width="9" height="9" rx="1" />
  </g>

  <!-- 右栏的小注，笔画更细 -->
  <g filter="url(#roughen)" fill="url(#strokeInkSoft)">
    <path d="M162 396 C204 394.8 244 395.8 284 394.6 L284 399 C244 400.2 204 401.2 162 402 Z" />
    <path d="M162 430 C196 428.8 228 429.8 260 428.6 L260 432.8 C228 434 196 435 162 436 Z" opacity="0.8" />
    <path d="M162 464 C190 462.8 216 463.8 242 462.6 L242 466.6 C216 467.8 190 468.8 162 470 Z" opacity="0.7" />
  </g>

  <!-- 校样朱笔：一道直划，一个圈，一点 -->
  <g stroke="#9c4033" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M494 122 C493 220 494 320 493 388" stroke-width="2.2" stroke-opacity="0.5" />
    <circle cx="514" cy="262" r="11" stroke-width="2" />
    <path d="M262 508 C280 514 300 514 318 508" stroke-width="1.8" stroke-opacity="0.42" />
  </g>

  <!-- 纸角的一点墨 -->
  <g fill="#24211c" fill-opacity="0.22">
    <circle cx="352" cy="510" r="2.4" />
    <circle cx="360" cy="516" r="1.6" />
    <circle cx="344" cy="518" r="1.3" />
  </g>

  <!-- 印 -->
  <g transform="rotate(-3 824 512)" opacity="0.86">
    <rect x="798" y="486" width="44" height="44" rx="3" fill="#9c4033" fill-opacity="0.9" />
    <rect x="803" y="491" width="34" height="34" rx="2" fill="none" stroke="#f6f2e8" stroke-opacity="0.5" stroke-width="1" />
    <text x="820" y="517" text-anchor="middle" font-family="KaiTi, STKaiti, 'Songti SC', serif"
      font-size="21" fill="#f6f2e8" fill-opacity="0.95">校</text>
  </g>

  <rect width="1000" height="620" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply" />
</svg>
